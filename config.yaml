name: Omini
version: "1.0.0"
slug: omini
description: Self-hosted multi-vendor network topology and traffic map (riccardoalv/omini)
url: https://github.com/riccardoalv/omini
arch:
  - aarch64
  - amd64
init: false
host_network: true
map:
  - share:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Omini web UI and API
webui: http://[HOST]:[PORT:8080]
panel_icon: mdi:lan
panel_title: Omini
panel_admin: true
privileged:
  - NET_RAW
  - NET_ADMIN
  - SYS_ADMIN
uart: false
usb: false
devices: []
udev: false
options:
  omini_nmap: "install"
schema:
  omini_nmap: list(off|install)
